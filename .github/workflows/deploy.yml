name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only the deploy job gets Pages write and an OIDC token; the build job (which runs
# third-party npm install scripts) is read-only.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # Matches local development (Node 24); jsdom's undici needs a webidl API Node 20 lacks.
          node-version: 24
          cache: npm
      - run: npm ci
      # The full gate (3-engine Playwright, axe, pytest) is `npm run release:check`, run
      # locally against the exact commit before every push; CI rebuilds and re-runs the fast checks.
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
